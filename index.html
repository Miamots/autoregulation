<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Autorégulation au quotidien</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fffaf4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Autorégulation">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
:root{
  --paper:#fffaf4; --card:#fff; --ink:#3a3550; --muted:#7a7286; --line:#efe4da;
  --teal:#2f7a66; --mint:#e3f2ec; --rose:#b8324f; --pink:#fde4ec; --gold:#9a6b12; --cream:#fff4d9;
  --blue:#3f63a8; --sky:#e6eefb; --lilac:#f1e8fa;
  --env:#5fa58b; --envbg:#f2f9f5; --task:#d2577b; --taskbg:#fdf2f6;
  --display:"Barlow",system-ui,sans-serif; --body:"Barlow",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:40}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2c94c;outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{padding-block:18px 8px}
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#fde4ec,#fff4d9 55%,#e3f2ec);border-radius:28px 12px 30px 14px;padding:14px 20px}
.hero img{width:78px;flex:none}
.hero h1{font-size:clamp(1.25rem,3.6vw,1.75rem);color:var(--ink)}
.hero p{margin:2px 0 0;color:var(--muted);font-weight:600}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);padding-block:10px;border-bottom:1.5px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-family:var(--display);font-weight:500;font-size:.95rem;color:var(--muted);display:flex;gap:7px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{background:#f28aa8;color:#fff;border-radius:999px;font-size:.75rem;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center;font-family:var(--body);font-weight:800}
.badge:empty{display:none}

main{padding-block:20px 48px}
.view{display:grid;gap:20px}
.intro h2{font-size:1.5rem}
.intro p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.kicker{font-family:var(--display);font-weight:500;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}

/* Grille des moments */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mcard{display:grid;grid-template-rows:150px auto;text-align:left;border:none;border-radius:22px;padding:12px 14px 16px;background:var(--bg);box-shadow:0 2px 0 rgba(58,53,80,.06);transition:transform .15s}
.mcard:hover{transform:translateY(-2px)}
.mcard img{height:140px;width:100%;object-fit:contain;justify-self:center}
.mcard h3{font-size:1.15rem;color:var(--c)}
.mcard span{font-size:.9rem;color:var(--muted)}
.mcard .count{display:inline-block;margin-top:4px;font-weight:700;color:var(--rose);font-size:.85rem}

/* Détail d'un moment */
.back{justify-self:start;border:none;background:none;color:var(--muted);font-weight:700;padding:4px 0}
.mhead{display:flex;align-items:center;gap:16px;background:var(--bg);border-radius:24px;padding:14px 18px}
.mhead img{width:min(170px,34vw);flex:none}
.mhead h2{font-size:clamp(1.5rem,4vw,2rem);color:var(--c)}
.mhead p{margin:6px 0 0;font-size:.98rem}
.hint{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.coreg{background:var(--pink);border-radius:20px;padding:14px 16px}
.coreg h3{color:var(--rose);font-size:1.15rem;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.colh{font-family:var(--display);font-weight:600;color:#fff;border-radius:14px;padding:7px 14px;font-size:1.05rem}
.colh.env{background:#7cb8a1}.colh.task{background:#e39ab0}
.col{display:grid;gap:10px;align-content:start}
.lever{border-radius:16px;padding:10px 12px}
.lever.e{background:var(--envbg)}.lever.t{background:var(--taskbg)}
.lever h4{font-size:1rem;margin-bottom:4px}
.remind{border:1.5px dashed var(--rc);border-radius:16px;padding:9px 12px;display:grid;gap:6px}.remind.e{--rc:#9fcbb9}.remind.t{--rc:#eab3c4}
.remind .rk{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.remind .rq{margin:0;font-size:.9rem;font-style:italic;color:var(--muted)}
.rchips{display:flex;flex-wrap:wrap;gap:5px}.rchips span{background:#fff;border:1px solid var(--rc);border-radius:999px;padding:2px 10px;font-size:.86rem;font-weight:600}
.rinsp{margin:6px 2px 0;font-size:.88rem;font-style:italic;color:var(--muted)}
.lever.e h4{color:var(--teal)}.lever.t h4{color:var(--rose)}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.idea{display:flex;align-items:flex-start;gap:8px;padding:4px 2px;border-radius:10px}
.idea span{flex:1;font-size:.97rem}
.heart{flex:none;width:32px;height:32px;margin:-4px 0;border:none;border-radius:50%;background:transparent;display:grid;place-items:center}
.heart svg{width:20px;height:20px;fill:none;stroke:#d9a3b3;stroke-width:2;transition:transform .15s}
.heart[aria-pressed="true"] svg{fill:#f2708f;stroke:#e2507a;transform:scale(1.12)}
.idea:has(.heart[aria-pressed="true"]){background:rgba(255,255,255,.75)}
.tip{display:flex;gap:10px;background:var(--cream);border-radius:16px;padding:12px 14px}
.tip b{color:var(--gold)}
.warn{background:#fdecea;border-left:5px solid #e07a6f;border-radius:12px;padding:10px 14px;font-size:.92rem}

/* Lire la situation */
.qcard{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:16px 18px;display:grid;gap:12px}
.qnum{font-family:var(--display);font-weight:600;width:38px;height:38px;border-radius:50%;background:var(--cream);color:var(--gold);display:grid;place-items:center;flex:none;font-size:1.15rem}
.qtitle{display:flex;gap:12px;align-items:center}
.qtitle h3{font-size:1.2rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid transparent;border-radius:18px;padding:12px 14px}
.choice img{width:72px;flex:none}
.choice b{font-family:var(--display);font-weight:600;font-size:1.05rem;display:block}
.choice small{color:var(--muted);font-size:.9rem}
.choice.yes{background:var(--mint)}.choice.yes b{color:var(--teal)}
.choice.no{background:#fde9e5}.choice.no b{color:#b4473a}
.choice[aria-pressed="true"].yes{border-color:var(--teal)}.choice[aria-pressed="true"].no{border-color:#b4473a}
.panel{border-radius:18px;padding:14px 16px}
.panel h4{font-size:1.05rem;margin-bottom:6px}
.p-mint{background:var(--mint)}.p-mint h4{color:var(--teal)}
.p-rose{background:#fde9e5}.p-rose h4{color:#b4473a}
.p-sky{background:var(--sky)}.p-sky h4{color:var(--blue)}
.p-cream{background:var(--cream)}.p-cream h4{color:var(--gold)}
.p-lilac{background:var(--lilac)}.p-lilac h4{color:#7d58a8}
.p-grey{background:#f4f1f3}.p-grey h4{color:#6e6a72}
ul.dots{margin:0;padding-left:18px;display:grid;gap:3px}
ul.dots li::marker{color:#e2708f}
.factors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.factor{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:4px;align-content:start}
.factor img{width:44px;height:44px;object-fit:contain}
.factor h4{font-size:1rem;color:var(--ink)}
.factor ul{font-size:.9rem}
.answers{display:flex;flex-wrap:wrap;gap:8px}
.answers span{border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.92rem;color:#8a5a0e;box-shadow:0 1px 0 #f0d9a0}
.linkbtn{border:none;background:none;padding:0;color:var(--teal);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.btn{border:none;border-radius:999px;background:var(--ink);color:#fff;padding:10px 18px;font-family:var(--display);font-weight:500;font-size:1rem}
.btn.soft{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.pink{background:#e2708f}
.btn[disabled]{opacity:.55;cursor:default}

/* Respiration */
.breath{background:linear-gradient(160deg,#e6eefb,#f1e8fa);border-radius:26px;padding:18px;display:grid;gap:14px;justify-items:center;text-align:center}
.breath h3{font-size:1.35rem;color:var(--blue)}
.breath>p{margin:0;max-width:52ch;color:var(--ink)}
.orb-wrap{position:relative;width:min(260px,70vw);aspect-ratio:1;display:grid;place-items:center}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(63,99,168,.25)}
.orb{width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bcd2f2 45%,#8fb0e3);box-shadow:0 8px 30px rgba(63,99,168,.25);transition:width var(--dur,5s) ease-in-out}
.orb.big{width:96%}
.orb-label{position:absolute;font-family:var(--display);font-weight:600;font-size:1.35rem;color:var(--blue);text-shadow:0 1px 0 #fff}
.seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.seg button{border:1.5px solid rgba(63,99,168,.3);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;color:var(--blue)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.timer{font-family:var(--display);font-size:1.1rem;color:var(--muted);min-height:1.5em}
.breath .small{font-size:.9rem;color:var(--muted)}

/* Stratégies adulte */
.bank{display:grid;gap:12px}
.bcat{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center;border-radius:20px;padding:12px 14px}
.bcat img{width:90px;height:100px;object-fit:contain}
.bcat h4{font-size:1.1rem;margin-bottom:8px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1.5px solid rgba(58,53,80,.12);background:rgba(255,255,255,.85);border-radius:999px;padding:5px 12px;font-size:.92rem;font-weight:600;display:flex;gap:5px;align-items:center}
.pick button[aria-pressed="true"]{background:#e2708f;color:#fff;border-color:#e2708f}
.pick button[aria-pressed="true"]::before{content:"♥"}
.addform{display:flex;gap:8px}.addform input{flex:1;min-width:0;border:1.5px solid rgba(184,50,79,.25);border-radius:999px;padding:9px 14px;background:#fff}
.own{display:inline-flex;align-items:center;gap:0}.own .x{padding:0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Mes idées */
.empty{background:#fff;border:2px dashed var(--line);border-radius:22px;padding:24px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty img{width:120px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who label{display:grid;gap:4px;font-weight:700;font-size:.92rem;color:var(--muted)}
.who input{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.opt{display:flex;gap:8px;align-items:center;font-weight:600}
.opt input{width:20px;height:20px;accent-color:#e2708f}
.mine{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;display:grid;gap:10px}
.minehead{display:flex;gap:12px;align-items:center}
.minehead img{width:64px;height:56px;object-fit:contain;flex:none}
.minehead h3{flex:1;font-size:1.15rem}
.mine .grp{font-family:var(--display);font-weight:500;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.mine ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mine li{display:flex;gap:8px;align-items:flex-start;background:#fdfaf7;border-radius:10px;padding:6px 8px}
.mine li span{flex:1}
.x{border:none;background:none;color:#c0b5bd;font-size:1.25rem;line-height:1;padding:0 4px}
.dlbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--cream);border-radius:18px;padding:12px 14px}
.msg{font-size:.92rem;color:var(--muted);min-height:1.2em}
.note{font-size:.88rem;color:var(--muted)}

.mineboxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbox{display:grid;gap:3px;border:2px dashed;border-radius:16px;padding:12px 14px}
.mbox b{font-family:var(--display);font-weight:600;font-size:1.02rem}.mbox small{color:var(--muted);font-style:italic;font-size:.88rem}
.mbox textarea{border:none;border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.8);resize:vertical;min-height:70px}
.helper summary{cursor:pointer;color:var(--teal);font-weight:700;font-size:.92rem}
.ladder{display:grid;gap:4px;margin-top:10px}
.rung{display:grid;grid-template-columns:1fr auto;gap:0 10px;border-radius:12px;padding:8px 12px}
.rung b{font-family:var(--display);font-weight:600}.rung span{grid-column:1;font-size:.88rem;color:var(--muted)}
.rung em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-weight:800;font-size:.78rem;border-radius:999px;padding:3px 10px;background:#fff}
.rung em.ok{color:var(--teal)}.rung em.no{color:#b4473a}
.seg.left{justify-content:flex-start}
.rule{margin:0;background:#fff;border-left:5px solid #e2708f;border-radius:10px;padding:10px 14px;font-weight:700}
@media (max-width:760px){.mineboxes{grid-template-columns:1fr}}
.fta{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;background:#fdfbf8;resize:vertical;margin-top:6px}
.cbx{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;border-radius:10px;cursor:pointer}
.cbx input{width:19px;height:19px;flex:none;margin-top:2px;accent-color:#e2708f}
.cbx small{color:var(--muted);font-weight:400}
.cbx:has(input:checked){background:rgba(255,255,255,.8)}
.cbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.cbgrid.one{grid-template-columns:1fr}
.factor .cbx{padding:3px 2px;font-size:.95rem}
.sugbox{border-radius:16px;padding:10px 12px;background:var(--pink);display:grid;gap:2px}
.sugbox.e{background:var(--envbg)}.sugbox.t{background:var(--taskbg)}
.sugbox h4{font-size:1rem;margin-bottom:2px}.sugbox.e h4{color:var(--teal)}.sugbox.t h4{color:var(--rose)}
.lvl{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.cbx.sug{font-size:.95rem}
.seg .sl{font-weight:700;font-size:.92rem;align-self:center;margin-right:4px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fde9e5;border-radius:14px;padding:10px 14px}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pnav .btn{width:46px;height:46px;padding:0;font-size:1.4rem}
.pcard{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:16px 18px;display:grid;gap:10px}
.phead{display:flex;align-items:center;gap:12px}.phead img{width:64px}.phead h3{font-size:1.35rem;color:var(--rose)}
.scene{margin:0;font-size:1.05rem;background:#fff4d9;border-radius:14px;padding:12px 14px}
.judge{background:#f4f1f3;border-radius:14px;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:1.2rem;color:#6e6a72;}
.judge small{display:block;font-family:var(--body);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--muted)}
.pstep{display:flex;gap:10px;align-items:center;margin-top:6px}.pstep b{display:block}.pstep small{color:var(--muted)}
.reveal summary{cursor:pointer;font-family:var(--display);font-weight:600;color:var(--teal);font-size:1.05rem;padding:6px 0}
.reveal[open]{display:grid;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pc{position:relative;border:3px solid transparent;border-radius:14px;padding:0;background:#fff;overflow:hidden;box-shadow:0 1px 0 rgba(58,53,80,.08)}
.pc img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff}
.pc[aria-pressed="true"]{border-color:#e2708f;box-shadow:0 0 0 3px #fde4ec}
.lv{position:absolute;top:4px;right:6px;font-style:normal;font-size:.6rem;letter-spacing:1px}.lv.l2{color:#2457c5}.lv.l3{color:#7d58a8}
.phrase{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:10;background:linear-gradient(120deg,#fde4ec,#fff4d9);border-radius:20px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 14px rgba(58,53,80,.08)}
.pslots{display:flex;align-items:center;gap:6px}.pslots img,.pslots .ph{width:58px;height:58px;border-radius:12px;background:#fff;object-fit:contain}
.pslots .ph{display:grid;place-items:center;color:#d9c9cf;font-family:var(--display);font-size:1.4rem;border:2px dashed #ecd5dc}
.arr{color:#c9aab5;font-size:1.3rem}
.phrase p{margin:0;flex:1;min-width:200px;font-size:1.08rem}
.sth{display:flex;align-items:center;gap:10px;font-size:1.15rem;margin-top:6px}
.subtabs{display:flex;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.subtabs button{border:none;background:none;border-radius:999px;padding:7px 16px;font-family:var(--display);font-weight:500;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:#e2708f;color:#fff}
.lead2{margin:0;color:var(--muted)}
.obj{color:var(--gold);font-weight:700}
.pslots{flex-wrap:wrap}.pslots img{width:50px;height:50px}
.fgrid{display:grid;gap:12px}
.fcard{background:var(--bg);border-radius:22px;overflow:hidden}
.fhead{display:grid;grid-template-columns:1fr 130px 26px;gap:12px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:12px 16px}
.fhead h3{color:var(--c);font-size:1.15rem}.fhead p{margin:4px 0 0;font-size:.93rem}
.fhead img{width:130px;max-height:110px;object-fit:contain}
.chev{font-family:var(--display);font-size:1.6rem;color:var(--c);text-align:center}
.fbody{padding:0 16px 16px;display:grid;gap:10px}
.glist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gi{background:rgba(255,255,255,.75);border-radius:14px;padding:9px 12px;display:grid;gap:2px}.gi b{color:var(--c);font-family:var(--display);font-weight:600}
.matlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.mat{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 10px;cursor:pointer}
.mat input{width:20px;height:20px;accent-color:#e2708f;flex:none}
.mat:has(input:checked){background:#f2f9f5;border-color:#a9d2c3}
.mimg{display:flex;gap:3px;flex:none}.mimg img{width:46px;height:46px;border-radius:8px;object-fit:contain}
.mat b{display:block;font-family:var(--display);font-weight:600}.mat small{color:var(--muted)}

function breathStop(label){B.running=false;clearTimeout(B.phaseTimer);cancelAnimationFrame(B.raf);const o=$("#orb");if(o){o.classList.remove("big")}const d=$("#sqdot");if(d){d.style.transitionDuration="0s";d.className="sqdot"}const l=$("#orb-label");if(l)l.textContent=label||"Prête?";const g=$("#breath-go");if(g)g.textContent="Commencer";const t=$("#timer");if(t&&!label)t.textContent=""}
function breathStart(){
  B.running=true;B.t0=performance.now();$("#breath-go").textContent="Arrêter";
  const o=$("#orb"),l=$("#orb-label"),d=$("#sqdot");
  if(B.mode==="carre"){const s=B.sq;o.style.setProperty("--dur",s+"s");if(d)d.style.transitionDuration=s+"s";
    const P=[["Inspire…",true,"c1"],["Retiens…",true,"c2"],["Expire…",false,"c3"],["Retiens…",false,"c0"]];if(d){d.style.transitionDuration="0s";d.className="sqdot c0";void d.offsetWidth;d.style.transitionDuration=s+"s"}let i=0;
    const phase=()=>{if(!B.running)return;const [t,big,c]=P[i];big?o.classList.add("big"):o.classList.remove("big");l.textContent=t;if(d)d.className="sqdot "+c;i=(i+1)%4;B.phaseTimer=setTimeout(phase,s*1000)};phase()}
  else{o.style.setProperty("--dur",B.rhythm+"s");let inhale=true;
    const phase=()=>{if(!B.running)return;inhale?o.classList.add("big"):o.classList.remove("big");l.textContent=inhale?"Inspire…":"Expire…";inhale=!inhale;B.phaseTimer=setTimeout(phase,B.rhythm*1000)};phase()}
  const total=B.mins*60*1000;
  const tick=()=>{if(!B.running)return;const left=Math.max(0,total-(performance.now()-B.t0));const s=Math.ceil(left/1000);$("#timer").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;if(left<=0){breathStop("Bravo!");$("#timer").textContent="Prenez un moment pour remarquer comment vous vous sentez.";return}B.raf=requestAnimationFrame(tick)};
  tick();
}

async function ficheDownload(btn){const msg=$("#f-msg");if(!window.jspdf){msg.textContent="Le PDF n'est pas disponible pour l'instant.";return}
  btn.disabled=true;msg.textContent="Préparation du PDF…";
  try{const r=await savePdf("ma-fiche-situation.pdf",await buildFichePdf());msg.textContent=r==="fallback"?"Si le PDF ne se télécharge pas, ouvrez l'outil en étant connectée à un compte Claude, puis réessayez.":"PDF prêt."}
  catch(err){const c=err&&err.code;msg.textContent=c==="declined"?"Téléchargement annulé.":(c==="unavailable"||c==="not_granted")?"Le téléchargement n'est pas disponible ici.":"Le PDF n'a pas pu être créé. Réessayez."}
  finally{btn.disabled=false}}
async function doDownload(which,btn){
  const msg=(btn.closest(".dlbox")||document).querySelector(".msg")||{};if(!window.jspdf){msg.textContent="Le PDF n'est pas disponible pour l'instant. Réessayez dans un moment.";return}
  btn.disabled=true;msg.textContent="Préparation du PDF…";
  try{const blob=await buildPdf(which);const g=groups().find(x=>x.id===which);
    const r=await savePdf("mes-idees-"+(which==="all"?"autoregulation":which)+".pdf",blob);msg.textContent=r==="fallback"?"Si le PDF ne se télécharge pas, ouvrez l'outil en étant connectée à un compte Claude, puis réessayez.":"PDF prêt.";}
  catch(err){const c=err&&err.code;msg.textContent=c==="declined"?"Téléchargement annulé.":c==="rate_limited"?"Une fenêtre de téléchargement est déjà ouverte. Réessayez dans un instant.":(c==="unavailable"||c==="not_granted")?"Le téléchargement n'est pas disponible ici.":"Le PDF n'a pas pu être créé. Réessayez.";}
  finally{btn.disabled=false}
}

    <div class="panel p-mint"><h4>Exposition douce</h4><p style="margin:0">Petits pas : l'enfant garde le choix, il sait à quoi s'attendre et il est disponible.<br>Le système nerveux peut parfois <b>s'habituer</b> graduellement.</p></div></div>
    <p class="rule">C'est l'enfant qui guide. On observe sa réaction, et on recule si elle augmente.</p></div>`:""}
   ${P==="rech"?`<div class="dlbar"><span style="flex:1">À quoi sert la recherche sensorielle? Quand devient-elle un risque?</span><button class="btn soft" data-snsub="rech">La recherche sensorielle</button></div>`:""}`}
  if(SN.sub==="rech")body=`
   <div class="qcard"><h3>La recherche sensorielle : ça sert à quoi?</h3><div class="grid3">
    ${[["p-rose","Hyperréactif qui recherche","Cherche des sensations pour éviter de ressentir les sensations inconfortables.","Emma fait des bruits de bouche pour couvrir les bruits ambiants."],["p-sky","Hyporéactif qui recherche","A besoin de plus de sensations pour se sentir vivant.","Léo touche à tout, fait beaucoup de bruit, recherche les mouvements intenses."],["p-mint","Profil « typique » qui recherche","Bouger m'aide à me sentir bien.","Louka gigote sur sa chaise lors d'une activité de motricité fine."]].map(([c,a,b,ex])=>`<div class="panel ${c}"><h4>${a}</h4><p style="margin:0">${b}</p><p class="ex">${ex}</p></div>`).join("")}</div></div>
   <div class="qcard"><h3>Une stratégie d'autorégulation</h3><div class="grid2">
    <div class="panel p-mint"><h4>Elle peut aider l'enfant à…</h4>${ul(["Se calmer","Se concentrer","Gérer ses émotions","Se sentir bien dans son corps"])}<p class="sm">Elle peut l'aider à atteindre un niveau d'éveil optimal pour participer à ses occupations quotidiennes.</p></div>
    <div class="panel p-cream"><h4>Le risque</h4>${ul(["Fait au mauvais moment","Dérange l'activité ou le groupe","Beaucoup trop, ou pas assez"])}</div></div>
    <div class="dlbar"><span style="flex:1">L'enfant essaie-t-il de se réguler? Sa stratégie est-elle efficace pour lui et le groupe?</span><button class="btn soft" data-goto="lire">Lire la situation</button></div></div>
   <div class="qcard"><h3>Distinction importante : recherche sensorielle ≠ TDAH</h3><div class="grid2">
    <div class="panel p-lilac"><h4>TDAH : un diagnostic</h4><p style="margin:0">Difficultés d'attention, impulsivité, hyperactivité.</p></div>
    <div class="panel p-mint"><h4>Recherche sensorielle : une stratégie</h4><p style="margin:0">Besoin de stimuli intenses pour se réguler.</p></div></div>
    <p class="rule">Un enfant peut avoir une recherche sensorielle sans TDAH, ou les deux en même temps.</p>
    <details class="reveal"><summary>Un mot sur le TDAH (DSM-5, 2013)</summary>
     <div class="panel p-grey"><h4>Hyperactivité et impulsivité</h4>${ul(["Remue les mains ou les pieds, ou se tortille sur son siège","Se lève dans des situations où il doit rester assis","Court ou grimpe partout","A du mal à se tenir tranquille dans les jeux ou les loisirs","Agit comme s'il était « monté sur des ressorts »","Parle trop","Laisse échapper une réponse à une question qui n'est pas encore entièrement posée","A du mal à attendre son tour","Interrompt souvent les autres ou impose sa présence"])}</div>
     <p class="note" style="margin:0">Les signes doivent être présents souvent pendant au moins 6 mois, dans au moins 2 contextes, et être plus prononcés que ceux attendus compte tenu du niveau de développement de l'enfant.</p></details></div>`;
  v.innerHTML=`<div class="intro"><div class="kicker">Le sensoriel</div><h2>Comprendre les profils sensoriels</h2><p>Des repères, des hypothèses, des pistes. Mais à garder en tête : <b>le sensoriel n'existe jamais tout seul.</b> Les réactions d'un enfant dépendent de plusieurs facteurs, dont l'état de son système nerveux dans le moment.</p></div>
   <div class="subtabs" role="group" aria-label="Sections">${SNSUB.map(([k,l])=>`<button data-snsub="${k}" aria-pressed="${SN.sub===k}">${l}</button>`).join("")}</div>${body}`;
}
document.addEventListener("click",e=>{
  const i=e.target.closest("[data-info]");if(i){e.preventDefault();openInfo(i.dataset.info);return}
  if(e.target.closest("[data-iclose]")||e.target.id==="info"){closeInfo();return}
  if($("#info")&&$("#info").open&&e.target.closest("#info [data-goto],#info [data-goto-sn],#info [data-goto-m]"))closeInfo();
  const gs=e.target.closest("[data-goto-sn]");if(gs){SN.sub=gs.dataset.gotoSn;show("sensoriel");scrollTo({top:0,behavior:"smooth"});return}
  const gm=e.target.closest("[data-goto-m]");if(gm){curMoment=gm.dataset.gotoM;show("moments");scrollTo({top:0,behavior:"smooth"});return}
  const s=e.target.closest("[data-snsub]");if(s){SN.sub=s.dataset.snsub;renderSensoriel();scrollTo({top:$("#view-sensoriel").getBoundingClientRect().top+scrollY-80,behavior:"smooth"});return}
  const ss=e.target.closest("[data-snprof]");if(ss){SN.prof=ss.dataset.snprof;const y=scrollY;renderSensoriel();scrollTo({top:y});return}
  const fmm=e.target.closest("[data-fichem]");if(fmm){FI.moment=fmm.dataset.fichem;saveF();show("lire");scrollTo({top:0,behavior:"smooth"});return}
  if(e.target.closest("[data-obsreset]")){OBSK=[];store.set("aq-obs",OBSK);const y=scrollY;renderSensoriel();scrollTo({top:y});return}
});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.obs;if(!k)return;
  OBSK=e.target.checked?[...new Set([...OBSK,k])]:OBSK.filter(x=>x!==k);store.set("aq-obs",OBSK);const y=scrollY;renderSensoriel();scrollTo({top:y})});


/* ================= Vue : accueil ================= */
function renderAccueil(){
  const G1=[["coherence","a-corps","#3f63a8","#e6eefb","Respire","J'ai besoin de souffler : quelques minutes de respiration."],
   ["moi","brain","#b8324f","#fde4ec","Moi, l'adulte","Mes signaux d'alerte, mes stratégies, ce qui me ressource."]];
  const G2=[["lire","gauge2","#2f7a66","#e3f2ec","Lire la situation","Je vis une situation difficile : je remplis une fiche, l'outil propose des idées."],
   ["moments","m-repas","#c46f2a","#fdeedd","Moments de la journée","Sieste, habillage, repas, transitions… Des idées concrètes pour chaque moment."],
   ["coreg","coregulation","#b8324f","#fde9e5","Corégulation","Prêter son calme : ma présence, ma voix, mon rythme."],
   ["sensoriel","s-hyper","#7d58a8","#f1e8fa","Le sensoriel","Les 8 sens, les profils, la recherche sensorielle."],
   ["pratique","glasses","#9a6b12","#fff4d9","Je me pratique","Les lunettes généreuses : reformuler sans jugement, chercher des hypothèses."],
   ["sens","f-cartes","#3f8a4f","#e8f4e6","Mon corps, mes sensations","Explorer le corps et les sensations avec les enfants : les cartes, des jeux, le matériel."]];
  const card=([v,img,c,bg,t,s])=>`<button class="start" data-goto="${v}" style="--c:${c};--bg:${bg}"><img src="img/${img}.webp" alt=""><span><b>${t}</b><small>${s}</small></span><i>›</i></button>`;
  $("#view-accueil").innerHTML=`<div class="intro"><div class="kicker">Bienvenue</div><h2>Par où commencer?</h2><p>Un outil pour soutenir l'autorégulation des enfants au quotidien, en commençant par la vôtre. Choisissez ce qui vous ressemble aujourd'hui.</p></div>
  <h3 class="sgh">Moi d'abord</h3><div class="startgrid">${G1.map(card).join("")}</div>
  <h3 class="sgh">Avec les enfants</h3><div class="startgrid">${G2.map(card).join("")}</div>
  <p class="rule">Moi d'abord : un adulte assez régulé peut prêter son calme à l'enfant.</p>
  <details class="apropos" id="apropos"><summary>À propos de cet outil</summary>
   <div class="grid2">
    <div class="panel p-cream"><h4>Qui sommes-nous</h4><p style="margin:0">Virginie Clavel et Valérie Ferron, ergothérapeutes. Cet outil accompagne la formation « Soutenir le développement de l'autorégulation en tenant compte des particularités sensorielles ».</p></div>
    <div class="panel p-rose"><h4>Important</h4><p style="margin:0">Cet outil donne des repères et des pistes. Il ne remplace pas une évaluation en ergothérapie et ne permet pas de poser un diagnostic. Au besoin, parlez-en aux parents, qui pourront consulter un professionnel.</p></div>
    <div class="panel p-mint"><h4>Vos données</h4><p style="margin:0">Tout ce que vous écrivez ou cochez reste dans ce navigateur, sur cet appareil. Rien n'est envoyé ailleurs. N'écrivez jamais le nom d'un enfant ou toute information pouvant permettre de l'identifier : utilisez par exemple ses initiales.</p></div>
    <div class="panel p-sky"><h4>Sources</h4>${ul(["Dawson, P., Guare, R. et Guare, C. (2025). Smart but scattered (2e éd.).","Équipe Naître et grandir (2022). Personnalité et tempérament.","Porges, S. W. (2022). Polyvagal theory: A science of safety.","Greene, R. W. (2008). Kids do well if they can. Phi Delta Kappan, 90(3), 160-167.","Williams, M. S. et Shellenberger, S. (2014). Alert Program [formation en ligne].","Questionnaire sensoriel : traduction libre de Building Bridges through Sensory Integration.","American Psychiatric Association (2015). DSM-5 : Manuel diagnostique et statistique des troubles mentaux (trad. française)."])}<p class="sm">La bibliographie complète est remise pendant la formation.</p></div>
   </div></details>`;
}
/* ================= Navigation ================= */
const VIEWS=["accueil","moments","lire","sensoriel","coreg","moi","coherence","sens","pratique"];let curView="accueil";
function setHash(h){try{history.replaceState(null,"","#"+h)}catch(e){}}
function show(v){
  if(curView==="coherence"&&v!=="coherence")breathStop();
  curView=v;VIEWS.forEach(x=>{$("#view-"+x).hidden=x!==v;$("#tab-"+x).setAttribute("aria-selected",x===v)});
  ({accueil:renderAccueil,moments:renderMoments,lire:renderLire,sensoriel:renderSensoriel,coreg:renderCoreg,moi:renderMoi,coherence:renderCoh,sens:renderSens,pratique:renderPratique})[v]();
  setHash(v==="moments"&&curMoment?"m-"+curMoment:v);
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{if(t.dataset.view==="moments")curMoment=null;show(t.dataset.view)}));
function fromHash(){const h=(location.hash||"").slice(1);if(h.startsWith("m-")&&MOMENTS.some(m=>m.id===h.slice(2))){curMoment=h.slice(2);show("moments")}else show(VIEWS.includes(h)?h:"accueil")}
window.addEventListener("hashchange",fromHash);
updBadge();fromHash();
</script>
